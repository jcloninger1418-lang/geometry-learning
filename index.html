<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Escape Road</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #unity-container{width:100%;height:100%;display:none}
  #unity-canvas{width:100%;height:100%;display:block}
  #loading{position:fixed;inset:0;background:#0f0404;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:Arial,sans-serif;color:#fff}
  #loading img{width:180px;border-radius:12px}
  .bar-wrap{width:300px;height:10px;background:#3a1008;border-radius:5px;overflow:hidden}
  .bar-fill{height:100%;background:#e8392a;width:0%;transition:width .2s;border-radius:5px}
  #loading p{font-size:13px;opacity:.6}
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas"></canvas></div>
<div id="loading">
  <img src="25011401/loading.png" alt="Escape Road">
  <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
  <p id="status">Loading game…</p>
</div>
<script>
  var config = {
    dataUrl:      "25011401/Build/escape-road-v25011401.data.unityweb",
    frameworkUrl: "25011401/Build/escape-road-v25011401.framework.js.unityweb",
    codeUrl:      "25011401/Build/escape-road-v25011401.wasm.unityweb",
    streamingAssetsUrl: "25011401/StreamingAssets",
    companyName:  "azgames.io",
    productName:  "Escape Road",
    productVersion: "25011401"
  };
  var bar    = document.getElementById('bar');
  var status = document.getElementById('status');
  var loading= document.getElementById('loading');
  var container = document.getElementById('unity-container');
  var canvas    = document.getElementById('unity-canvas');

  var script = document.createElement('script');
  script.src = "25011401/Build/escape-road-v25011401.loader.js";
  script.onload = function() {
    createUnityInstance(canvas, config, function(progress) {
      bar.style.width = (progress * 100) + '%';
      status.textContent = 'Downloading… ' + Math.round(progress * 100) + '%';
    }).then(function(instance) {
      window.unityInstance = instance;
      setTimeout(function() {
        loading.style.display = 'none';
        container.style.display = 'block';
      }, 500);
    }).catch(function(msg) {
      status.textContent = 'Error: ' + msg;
      console.error(msg);
    });
  };
  script.onerror = function() {
    status.textContent = 'Failed to load game files. Make sure you are running via a local server.';
  };
  document.body.appendChild(script);
</script>
</body>
</html>

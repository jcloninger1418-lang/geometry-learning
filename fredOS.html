.tt{display:flex;align-items:center;gap:12px;min-width:0}

<script>
const $=s=>document.querySelector(s);
let z=10,focused=null;const wins={};
const apps={

function mark(){

 for(const id in wins){
  const w=wins[id],min=w.el.classList.contains('min'),b=document.createElement('button');
  b.className='tb'+(min?'':' on')+(!min&&focused===id?' f':'');

  b.onclick=()=>{if(min){w.el.classList.remove('min');focus(id)}else if(focused===id){w.el.classList.add('min');mark()}else focus(id)};

 }
}
function focus(id){z++;focused=id;for(const k in wins){wins[k].el.classList.toggle('focus',k===id)}wins[id].el.style.zIndex=z;mark()}

 if(wins[id]){wins[id].el.classList.remove('min');focus(id);return}
 const a=apps[id],el=document.createElement('div'),mob=innerWidth<700,n=Object.keys(wins).length;
 const W=Math.min(a.w,innerWidth-24),H=Math.min(a.h,innerHeight-(mob?120:80));
 el.className='win glass'+(a.bare?' bare':'');
 el.style.cssText=`width:${W}px;height:${H}px;left:${mob?12:Math.max(12,(innerWidth-W)/2+n*30-50)}px;top:${mob?16:Math.max(16,(innerHeight-52-H)/2+n*30-40)}px`;
 el.innerHTML=a.bare?'<div class="body"></div>':`<div class="bar"><i data-a="x"></i><i data-a="m"></i><i data-a="z"></i><span>${a.t}</span></div><div class="body"></div>`;
 $('#desk').appendChild(el);
 const inst=a.build(el.querySelector('.body'))||{};
 wins[id]={el,inst};mark();focus(id);
 el.addEventListener('pointerdown',()=>focus(id));
 const bar=el.querySelector('.bar')||el.querySelector('[data-drag]');
 bar.addEventListener('click',e=>{
  const k=e.target.dataset.a;if(!k)return;
  if(k==='x')closeApp(id);else if(k==='m'){el.classList.add('min');mark()}else el.classList.toggle('max');
 });

}
function closeApp(id){
 const w=wins[id];w.inst.destroy&&w.inst.destroy();w.el.classList.add('closing');delete wins[id];mark();
 setTimeout(()=>w.el.remove(),260);
 const ks=Object.keys(wins);if(ks.length)focus(ks[ks.length-1]);else{focused=null}
}
function drag(el,bar){

 const LOGO=n=>`<img src="${LG}" width="${n}" height="${n}" alt="" style="display:block">`;
 const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const mmss=t=>{t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
 const dtxt=t=>{const m=Math.round(t/60),h=Math.floor(m/60);return h?`${h} hr ${m%60} min`:`${m} min`};
 const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
 const art=(seed,over)=>{
  const h=hue(seed),h2=(h+50+hue(seed+'x')%90)%360,v=hue(seed+'v')%3,c1=`hsl(${h} 70% 55%)`,c2=`hsl(${h2} 75% 62%)`;
  let g;
  if(v===0)g=`<circle cx="210" cy="110" r="120" fill="${c1}" opacity=".85"/><circle cx="210" cy="110" r="80" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/><circle cx="90" cy="190" r="70" fill="${c2}" opacity=".8"/>`;
  else if(v===1)g=[0,1,2,3,4,5].map(i=>`<rect x="${-40+i*60}" y="-20" width="26" height="360" fill="${i%2?c1:c2}" opacity=".75" transform="rotate(25 150 150)"/>`).join('')+`<circle cx="150" cy="110" r="46" fill="#000" opacity=".55"/>`;
  else g=`<path d="M0 170C80 90 160 230 300 110V300H0Z" fill="${c1}" opacity=".85"/><path d="M0 215C90 155 180 265 300 175V300H0Z" fill="${c2}" opacity=".8"/><circle cx="220" cy="70" r="34" fill="#fff" opacity=".9"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 55% 20%)"/><stop offset="1" stop-color="#050505"/></linearGradient></defs><rect width="300" height="300" fill="url(#b)"/>${g}${over}</svg>`;

   const o=slide(idx.map(i=>g[i]));idx.forEach((i,j)=>{if(g[i]!==o[j])ch=true;g[i]=o[j]});
  }
  if(ch){add();draw()}
  return true;
 }
 b.querySelector('#nw').onclick=init;swipe(gr,key);init();
 return{onkey:key};
}

function pong(b){
 b.innerHTML='<div class="hud"><span>You <b id="p">0</b></span><span>CPU <b id="c">0</b></span></div><canvas width="400" height="260"></canvas><p class="hint">Move your mouse / finger, or use W &amp; S</p>';
 const cv=b.querySelector('canvas'),x=cv.getContext('2d');
 let py=110,cy=110,bx=200,by=130,vx=3.4,vy=2,ps=0,cs=0,raf,H=60;
 const serve=d=>{bx=200;by=130;vx=3.4*d;vy=(Math.random()*3-1.5)};
 function move(e){const r=cv.getBoundingClientRect();py=Math.min(260-H,Math.max(0,(e.clientY-r.top)*260/r.height-H/2))}
 cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);
 function loop(){
  bx+=vx;by+=vy;if(by<4||by>256)vy*=-1;
  cy+=Math.max(-3,Math.min(3,by-H/2-cy));
  if(bx<22&&bx>12&&by>py&&by<py+H&&vx<0){vx=Math.min(8,-vx*1.06);vy+=(by-(py+H/2))*.12}
  if(bx>378&&bx<388&&by>cy&&by<cy+H&&vx>0){vx=-vx*1.04;vy+=(by-(cy+H/2))*.1}
  if(bx<-10){cs++;b.querySelector('#c').textContent=cs;serve(1)}
  if(bx>410){ps++;b.querySelector('#p').textContent=ps;[1,3,5].forEach((v,i)=>ps>=v&&unlock('pong',i));serve(-1)}
  const f=fg();x.clearRect(0,0,400,260);x.fillStyle=f;
  x.globalAlpha=.25;for(let i=0;i<260;i+=20)x.fillRect(199,i,2,10);x.globalAlpha=1;
  x.beginPath();x.roundRect(10,py,8,H,4);x.fill();x.beginPath();x.roundRect(382,cy,8,H,4);x.fill();
  x.beginPath();x.arc(bx,by,6,0,7);x.fill();
  raf=requestAnimationFrame(loop);
 }
 loop();
 return{onkey(k){if(k==='w'||k==='ArrowUp'){py=Math.max(0,py-28);return true}if(k==='s'||k==='ArrowDown'){py=Math.min(260-H,py+28);return true}return false},destroy(){cancelAnimationFrame(raf)}};
}
